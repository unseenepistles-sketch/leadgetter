<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LeadSystem{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">◆ LeadSystem</a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/landing">Opt-in page</a>
      <a href="/health">Health</a>
    </nav>
  </header>
  <main class="wrap">
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <p>Creator-led, permission-based lead generation. No follower scraping — by design.</p>
  </footer>
</body>
</html>
